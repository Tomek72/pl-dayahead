[project]
name = "pl-dayahead"
version = "0.1.0"
description = "Polish day-ahead electricity price forecast, issued at 11:00 Warsaw time for the next delivery day"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "duckdb>=1.5.6",
    "entsoe-py>=0.8.1",
    "holidays>=0.107",
    "matplotlib>=3.11.2",
    "pandas>=3.0.6",
    "python-dotenv>=1.2.4",
    "pytz>=2026.5",
    "scikit-learn>=1.9.1",
]

[build-system]
requires = ["uv_build>=0.11.26,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "jupyterlab>=4.6.4",
    "pytest>=9.1.1",
]
